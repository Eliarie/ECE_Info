name: 补齐全部外文翻译

on:
  workflow_dispatch:

concurrency:
  group: ece-translation
  cancel-in-progress: false

jobs:
  translate-all:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 翻译全部未完成外文
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TRANSLATION_MAX_ARTICLES: '0'
          TRANSLATION_REQUEST_RETRIES: '3'
        run: python scripts/translate.py

      - name: 按单一主类别重新分类
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RETAG_MAX_ARTICLES: '0'
          RETAG_REQUEST_RETRIES: '3'
        run: python scripts/retag.py
